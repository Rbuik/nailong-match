<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>强制改名窗口 · 预览</title>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #3b3355 0%, #1b1826 55%, #121019 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .stage { display: flex; align-items: center; gap: 54px; flex-wrap: wrap; justify-content: center; padding: 28px; }

  /* ---------- 手机外壳 ---------- */
  .phone {
    position: relative; width: 390px; height: 780px; border-radius: 44px;
    background: #0b0a10; padding: 10px; box-sizing: border-box;
    box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 36px;
    background: #fff; overflow: hidden;
  }

  /* ---------- 主页（简化还原） ---------- */
  .home { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 58px; box-sizing: border-box; }
  .home-title {
    font-size: 30px; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px;
    background: linear-gradient(90deg,#ff5c5c,#ffb13d,#3ecf7a,#5c8fff,#c85cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .home-sub { font-size: 12px; color: #a99fc7; margin-bottom: 30px; }
  .home-btn {
    width: 210px; padding: 13px 0; border-radius: 30px; margin-bottom: 12px;
    font-size: 16px; font-weight: 700; text-align: center;
    background: rgba(92,143,255,.08); color: #3a78ff; border: 2px solid rgba(92,143,255,.55);
  }
  .home-btn.dark { background: rgba(0,0,0,.05); color: #222; border-color: rgba(0,0,0,.65); }
  .home-foot { position: absolute; bottom: 24px; font-size: 11px; color: #b8b2c9; }

  /* ---------- 遮罩 ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(245,245,247,.96); backdrop-filter: blur(5px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .28s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-size: 24px; font-weight: 800; margin-bottom: 15px;
    background: linear-gradient(90deg,#ff5c5c,#ffb13d,#3ecf7a,#5c8fff,#c85cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hint { width: 86%; margin: 0 0 10px; font-size: 12px; line-height: 1.55; color: #999; text-align: center; }
  .lb-form { display: flex; gap: 8px; width: 90%; margin-bottom: 8px; }
  .lb-form input {
    flex: 1; min-width: 0; padding: 9px 11px; border-radius: 10px;
    border: 1px solid rgba(0,0,0,.12); font-size: 13px; background: #fff; color: #333;
    outline: none; transition: border-color .15s, background .15s;
  }
  .lb-form input:focus { border-color: #7c5cff; }
  .lb-form input.error { border-color: #ff5c5c; background: rgba(255,92,92,.06); }
  .err { margin: 0 0 10px; width: 86%; font-size: 12px; line-height: 1.4; color: #e54848; text-align: center; min-height: 17px; }
  .btn {
    width: 180px; padding: 14px 0; border-radius: 30px; font-size: 17px; font-weight: 700;
    cursor: pointer; transition: transform .1s ease, background .15s ease; user-select: none;
    background: rgba(92,143,255,.08); color: #3a78ff; border: 2px solid rgba(92,143,255,.55);
  }
  .btn:hover { background: rgba(92,143,255,.16); }
  .btn:active { transform: scale(.95); }

  /* 点遮罩时的「关不掉」反馈 */
  .shake { animation: shake .34s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    45% { transform: translateX(6px); }
    70% { transform: translateX(-3px); }
  }
  .lock-note {
    position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
    background: rgba(34,34,44,.92); color: #fff; font-size: 12px; padding: 9px 16px;
    border-radius: 999px; opacity: 0; transition: opacity .2s ease; white-space: nowrap;
  }
  .lock-note.show { opacity: 1; }

  /* 成功后的 toast */
  .toast {
    position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(8px);
    background: rgba(34,34,44,.92); color: #fff; font-size: 13px; padding: 10px 18px;
    border-radius: 999px; opacity: 0; transition: all .22s ease; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 右侧说明 ---------- */
  .notes { width: 340px; max-width: 84vw; }
  .notes h1 { font-size: 19px; margin: 0 0 6px; font-weight: 700; }
  .notes .lead { font-size: 12px; color: #9a93b3; margin: 0 0 22px; line-height: 1.6; }
  .note {
    display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,.09);
    font-size: 13px; line-height: 1.6; color: #ded9ee;
  }
  .note i {
    flex: 0 0 20px; height: 20px; border-radius: 7px; font-style: normal; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(124,92,255,.24); color: #b9a8ff; margin-top: 1px;
  }
  .note b { color: #fff; font-weight: 600; }
  .reset {
    margin-top: 22px; padding: 10px 18px; border-radius: 999px; cursor: pointer;
    background: transparent; color: #b9a8ff; border: 1px solid rgba(185,168,255,.45);
    font-size: 12px; font-family: inherit;
  }
  .reset:hover { background: rgba(185,168,255,.1); }

  @media (max-width: 860px) {
    .stage { gap: 26px; padding: 16px; }
    .phone { transform: scale(.9); transform-origin: top center; }
    .notes { width: 390px; max-width: 92vw; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="home">
        <div class="home-title">奶龙消消乐</div>
        <div class="home-sub" id="home-nick">奶龙玩家</div>
        <div class="home-btn">开始游戏</div>
        <div class="home-btn">更多玩法</div>
        <div class="home-btn dark">每日任务</div>
        <div class="home-btn dark">📮 邮箱</div>
        <div class="home-foot">👤 昵称会显示在排行榜上</div>
      </div>

      <div class="overlay" id="overlay">
        <h2 class="title">✏️ 先起个昵称</h2>
        <p class="hint">「奶龙玩家」是默认昵称，不能直接用<br>最多 8 个字，特殊符号只能用 - . _</p>
        <div class="lb-form">
          <input type="text" id="nick" maxlength="8" placeholder="输入你的昵称" autocomplete="off">
        </div>
        <p class="err" id="err"></p>
        <button class="btn" id="ok">确定</button>
        <div class="lock-note" id="lock">这个窗口关不掉，先改个名字吧</div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <div class="notes">
    <h1>强制改名窗口</h1>
    <p class="lead">玩家昵称还是「奶龙玩家」时自动弹出，必须改名才能继续。</p>
    <div class="note"><i>1</i><div><b>没有返回键</b>，点遮罩也不关，会被轻轻顶回来。</div></div>
    <div class="note"><i>2</i><div>输入框<b>强制留空</b>，不能靠点一下「确定」蒙混过去。</div></div>
    <div class="note"><i>3</i><div>改回「奶龙玩家」会被明确拒绝；空名字、超长、特殊符号都会提示。</div></div>
    <div class="note"><i>4</i><div>改名成功窗口才自己淡出，账号名、排行榜、服务器记录同步更新。</div></div>
    <button class="reset" id="reset">重新演示</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var overlay = document.getElementById('overlay');
  var input = document.getElementById('nick');
  var err = document.getElementById('err');
  var lock = document.getElementById('lock');
  var toast = document.getElementById('toast');
  var homeNick = document.getElementById('home-nick');

  var SENSITIVE = ['黄君丽','傻逼','傻b','煞笔','沙比','智障','脑残','贱人','婊子','尼玛','操你','干你','色情','赌博','毒品','诈骗'];

  function plain(v) {
    return String(v || '').toLowerCase().replace(/[\s._\-]/g, '');
  }

  // 与 Meta.validateNick 完全一致
  function validate(v) {
    var s = String(v || '').trim();
    if (!s) return { ok: false, reason: '昵称不能为空' };
    if (s === '奶龙玩家') return { ok: false, reason: '不能再用「奶龙玩家」，换一个吧' };
    if (s.length > 8) return { ok: false, reason: '昵称最多 8 个字' };
    if (!/^[\u4e00-\u9fa5A-Za-z0-9._\-]+$/.test(s)) return { ok: false, reason: '特殊符号只能用 - . _ 三个' };
    var p = plain(s);
    if (SENSITIVE.some(function (w) { return p.indexOf(plain(w)) >= 0; })) {
      return { ok: false, reason: '改名字含敏感词，请重新输入' };
    }
    return { ok: true, name: s };
  }

  function fail(msg) {
    err.textContent = msg;
    input.classList.add('error');
  }

  function submit() {
    var r = validate(input.value);
    if (!r.ok) { fail(r.reason); return; }
    err.textContent = '';
    input.classList.remove('error');
    overlay.classList.add('hidden');
    homeNick.textContent = r.name;
    toast.textContent = '昵称已改为「' + r.name + '」';
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 2400);
  }

  document.getElementById('ok').addEventListener('click', submit);
  input.addEventListener('input', function () {
    err.textContent = '';
    input.classList.remove('error');
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submit();
  });

  // 点遮罩：不关，只抖一下 + 提示「关不掉」
  overlay.addEventListener('click', function (e) {
    if (e.target !== overlay) return;
    overlay.classList.add('shake');
    lock.classList.add('show');
    setTimeout(function () { overlay.classList.remove('shake'); }, 360);
    setTimeout(function () { lock.classList.remove('show'); }, 1500);
  });

  document.getElementById('reset').addEventListener('click', function () {
    overlay.classList.remove('hidden');
    input.value = '';
    err.textContent = '';
    input.classList.remove('error');
    homeNick.textContent = '奶龙玩家';
    toast.classList.remove('show');
    input.focus();
  });

  setTimeout(function () { try { input.focus(); } catch (e) {} }, 300);
})();
</script>
</body>
</html>

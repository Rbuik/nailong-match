<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>糖果样式预览</title>
<style>
 body{margin:0;padding:14px;font:13px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;background:#f6f1e6;color:#333}
 h2{font-size:13px;margin:0 0 8px;color:#666;font-weight:600}
 .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
 .cellbox{width:64px;height:64px;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
 .big{width:180px;height:180px;border-radius:18px}
 canvas{display:block}
</style></head><body>
<h2>糖果徽标在深 / 中 / 浅底上的样子</h2>
<div class="wrap" id="row1"></div>
<h2>放大 3 倍</h2>
<div class="wrap" id="row3"></div>
<script>
  // 糖果：圆糖体 + 两端拧出来的糖纸，和钥匙一样纯路径画（emoji 吃不了黑描边）
  function drawCandyMark(g, cell, pulse) {
    const k = cell * 0.72;            // 糖果总宽
    const bodyR = k * 0.26;           // 糖体半径
    const wingL = k * 0.48;           // 糖纸尖到中心的距离
    const wingH = k * 0.17;           // 糖纸半高
    const notch = k * 0.075;          // 糖纸尖的分叉缺口

    // 背后一层粉色柔光
    g.save();
    g.shadowBlur = 0;
    const glow = g.createRadialGradient(0, 0, k * 0.05, 0, 0, k * 0.62);
    glow.addColorStop(0, 'rgba(255,140,190,' + (0.30 + 0.18 * pulse).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(255,140,190,0)');
    g.fillStyle = glow;
    g.beginPath();
    g.arc(0, 0, k * 0.62, 0, Math.PI * 2);
    g.fill();

    const paint = (fill) => {
      // 左糖纸（带分叉的燕尾）
      g.beginPath();
      g.moveTo(-bodyR * 0.6, 0);
      g.lineTo(-wingL, -wingH);
      g.lineTo(-wingL + notch, 0);
      g.lineTo(-wingL, wingH);
      g.closePath();
      if (fill) g.fill(); else g.stroke();
      // 右糖纸
      g.beginPath();
      g.moveTo(bodyR * 0.6, 0);
      g.lineTo(wingL, -wingH);
      g.lineTo(wingL - notch, 0);
      g.lineTo(wingL, wingH);
      g.closePath();
      if (fill) g.fill(); else g.stroke();
      // 圆糖体
      g.beginPath();
      g.arc(0, 0, bodyR, 0, Math.PI * 2);
      if (fill) g.fill(); else g.stroke();
    };

    g.save();
    g.lineJoin = 'round';
    g.lineCap = 'round';
    // 1) 黑色加粗描一遍
    g.strokeStyle = '#000';
    g.lineWidth = Math.max(2.4, cell * 0.09);
    paint(false);
    // 2) 填色：糖纸稍深、糖体粉白渐变
    const wrap = g.createLinearGradient(-wingL, -wingH, wingL, wingH);
    wrap.addColorStop(0, '#ff8fc0');
    wrap.addColorStop(0.5, '#ffc3dd');
    wrap.addColorStop(1, '#ff8fc0');
    g.fillStyle = wrap;
    paint(true);
    // 糖体重填（盖掉糖纸填色侵入圆内的部分）
    const body = g.createRadialGradient(-bodyR * 0.35, -bodyR * 0.35, bodyR * 0.15, 0, 0, bodyR);
    body.addColorStop(0, '#ffffff');
    body.addColorStop(0.55, '#ffd9e8');
    body.addColorStop(1, '#ff9ec6');
    g.beginPath();
    g.arc(0, 0, bodyR, 0, Math.PI * 2);
    g.fill();
    // 糖体上的斜条纹
    g.save();
    g.beginPath();
    g.arc(0, 0, bodyR, 0, Math.PI * 2);
    g.clip();
    g.strokeStyle = 'rgba(255,110,170,0.75)';
    g.lineWidth = Math.max(1.6, cell * 0.055);
    for (let i = -2; i <= 2; i++) {
      g.beginPath();
      g.moveTo(i * bodyR * 0.62 - bodyR, bodyR);
      g.lineTo(i * bodyR * 0.62 + bodyR, -bodyR);
      g.stroke();
    }
    g.restore();
    // 糖体左上一粒高光
    g.fillStyle = 'rgba(255,255,255,0.95)';
    g.beginPath();
    g.arc(-bodyR * 0.38, -bodyR * 0.4, bodyR * 0.18, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }
  function render(cell, pulse, bgs, big) {
    const wrap = document.getElementById(bgs[1]);
    bgs[0].forEach((bg) => {
      const box = document.createElement('div');
      box.className = 'cellbox' + (big ? ' big' : '');
      box.style.background = bg;
      const cv = document.createElement('canvas');
      cv.width = cell * 2.2; cv.height = cell * 2.2;
      const g = cv.getContext('2d');
      g.translate(cv.width/2, cv.height/2);
      g.shadowColor = 'rgba(255,140,190,0.9)';
      g.shadowBlur = cell * 0.3;
      drawCandyMark(g, cell, pulse);
      box.appendChild(cv);
      wrap.appendChild(box);
    });
  }
  render(34, 0.5, [['#2b2340','#c9b8f0','#f6f1e6'],'row1',0], false);
  render(100, 0.5, [['#2b2340','#c9b8f0','#f6f1e6'],'row3',0], true);
</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/themes.css">
<style>
 body{background:#fbf6ea;margin:0;padding:14px;font:13px system-ui,"Microsoft YaHei",sans-serif;display:block;}
 .sim{width:360px;background:#f4ecff;border-radius:16px;padding:12px 0;margin-bottom:16px;display:flex;flex-direction:column;align-items:center;}
 .cap{font:12px system-ui;color:#8b84a0;margin:0 0 8px 4px;align-self:flex-start;}
</style>
</head>
<body>
<div class="sim">
  <div class="cap">消消乐大师（通关一半的样子）</div>
  <div class="overlay" style="position:static;display:flex;width:100%;padding:6px 0;">
    <h2 class="title small">🏆 消消乐大师</h2>
    <div class="master-card">
      <div class="master-head">
        <span class="master-crown" id="master-crown">🥈</span>
        <div class="master-title-box">
          <b id="master-title">消消乐达人</b>
          <i id="master-sub">已经过半，继续往前</i>
        </div>
      </div>
      <div class="master-bar"><span id="master-bar-fill" style="width:55%;"></span></div>
      <p class="master-progress" id="master-progress">已通关 22 / 40 关 · 三星 9 关</p>
      <div class="master-grid">
        <div class="master-item"><span>主线总分</span><b id="complete-total-score">238460</b></div>
        <div class="master-item"><span>总星数</span><b id="complete-total-stars">56</b></div>
        <div class="master-item"><span>三星关卡</span><b id="master-perfect">9 / 40</b></div>
        <div class="master-item"><span>成就</span><b id="master-ach">11 / 25</b></div>
      </div>
      <p class="master-foot" id="master-foot">还差 18 关全部通关</p>
    </div>
  </div>
</div>
<div class="sim">
  <div class="cap">消消乐大师（全三星毕业）</div>
  <div class="overlay" style="position:static;display:flex;width:100%;padding:6px 0;">
    <h2 class="title small">🏆 消消乐大师</h2>
    <div class="master-card">
      <div class="master-head">
        <span class="master-crown">👑</span>
        <div class="master-title-box">
          <b>消消乐宗师</b>
          <i>全关三星，无可挑剔</i>
        </div>
      </div>
      <div class="master-bar"><span style="width:100%;"></span></div>
      <p class="master-progress">已通关 40 / 40 关 · 三星 40 关</p>
      <div class="master-grid">
        <div class="master-item"><span>主线总分</span><b>986420</b></div>
        <div class="master-item"><span>总星数</span><b>120</b></div>
        <div class="master-item"><span>三星关卡</span><b>40 / 40</b></div>
        <div class="master-item"><span>成就</span><b>25 / 25</b></div>
      </div>
      <p class="master-foot">全部三星，满分毕业 🎉</p>
    </div>
  </div>
</div>
</body>
</html>

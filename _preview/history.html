<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/themes.css">
<style>body{margin:0}</style></head><body>
<div class="overlay" id="history-menu" style="display:flex;position:relative;height:560px;">
  <h2 class="title small">关卡记录</h2>
  <div class="history-list" id="history-list">
    <div class="history-item"><span class="h-name"><span class="h-lv">第 1 关</span></span><span class="h-stars">⭐⭐⭐</span><span class="h-score">2000</span></div>
    <div class="history-item"><span class="h-name"><span class="h-lv">第 2 关</span></span><span class="h-stars">⭐⭐☆</span><span class="h-score">1800</span></div>
    <div class="history-item"><span class="h-name"><span class="h-lv">第 3 关</span></span><span class="h-stars">⭐☆☆</span><span class="h-score">1200</span></div>
  </div>
  <button class="btn-secondary" id="btn-history-back">返回</button>
  <button id="btn-replay-ending">结算</button>
</div>
</body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/themes.css">
<style>
  body { margin: 0; background: #f6f2e8; font-family: system-ui, "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h2 { margin-top: 24px; }
</style>
</head>
<body>
  <h2 class="title small">购物商店 · 💰 <span id="shop-coins">620</span></h2>
  <div class="shop-stage" id="shop-stage">
    <div class="shop-track" id="shop-list"></div>
  </div>
  <div class="shop-dots" id="shop-dots"></div>
  <script>
    const SHOP = [
      { key: 'extraMoves', name: '+3 步', price: 300, desc: '本局步数 +3', icon: '👣' },
      { key: 'extraTime', name: '+7s', price: 300, desc: '本局时间 +7s（限时关）', icon: '⏱️' },
      { key: 'shuffle', name: '洗牌 +1', price: 150, desc: '重排棋盘一次', icon: '🔄' },
      { key: 'undo', name: '撤回 +1', price: 150, desc: '回退上一步', icon: '↩️' },
      { key: 'startFrost', name: '霜块道具', price: 20, desc: '开局放一块霜块\n消掉后 3 步内机关暂停', icon: '❄️' },
      { key: 'startBomb', name: '炸弹道具', price: 180, desc: '开局在随机位置放一颗炸弹', icon: '💣' },
      { key: 'startMagnet', name: '磁铁道具', price: 210, desc: '开局放一块磁铁\n吸同行同列同色一起消', icon: '🧲' },
      { key: 'rainbow', name: '彩虹道具', price: 230, desc: '随机把一块变成彩虹', icon: '🌈' },
      { key: 'startPropeller', name: '螺旋桨道具', price: 250, desc: '开局放一块螺旋桨\n斜扫两条对角线', icon: '🛩️' },
      { key: 'startLine', name: '线消道具', price: 300, desc: '开局在随机位置放一条线消', icon: '➖' },
      { key: 'startPaint', name: '颜料道具', price: 500, desc: '开局放一块颜料\n把一大片刷成同一种颜色', icon: '🎨' }
    ];
    const coins = 620;
    const list = document.getElementById('shop-list');
    SHOP.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'shop-card';
      card.innerHTML =
        '<span class="shop-card-ico">' + item.icon + '</span>' +
        '<b class="shop-card-name">' + item.name + '</b>' +
        '<small class="shop-card-desc">' + item.desc.replace(/\n/g, '<br>') + '</small>' +
        '<span class="shop-card-own">持有 0</span>' +
        '<button class="shop-buy" ' + (coins < item.price ? 'disabled' : '') + '>🪙 ' + item.price + '</button>';
      list.appendChild(card);
    });
    const dots = document.getElementById('shop-dots');
    SHOP.forEach((_, i) => {
      const d = document.createElement('i');
      d.className = 'shop-dot' + (i === 0 ? ' on' : '');
      dots.appendChild(d);
    });
    // ?i=4 之类：滚到指定卡片，方便截图
    const idx = Number(new URLSearchParams(location.search).get('i') || 0);
    if (idx > 0) {
      const stage = document.getElementById('shop-stage');
      const cards = list.children;
      const step = cards[0].offsetWidth + 10;
      stage.scrollLeft = idx * step;
      [...dots.children].forEach((d, k) => d.classList.toggle('on', k === idx));
    }
  </script>
</body>
</html>

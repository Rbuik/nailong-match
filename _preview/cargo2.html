<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>钥匙样式预览</title>
<style>
 body{margin:0;padding:14px;font:13px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;background:#f6f1e6;color:#333}
 h2{font-size:13px;margin:0 0 8px;color:#666;font-weight:600}
 .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
 .cellbox{width:64px;height:64px;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
 canvas{display:block}
</style></head><body>
<h2>🔑 emoji 钥匙 + 黑描边（深 / 中 / 浅底）</h2>
<div class="wrap" id="row1"></div>
<h2>实际棋盘尺寸 34px（小格）</h2>
<div class="wrap" id="row4"></div>
<script>
  // 🔑 emoji 的纯黑剪影（描边用），按尺寸缓存一次 —— 与 js/game.js 同步
  let KEY_EMOJI_SIL = null;
  function keyEmojiSilhouette(px, dpr) {
    const key = px + '@' + dpr;
    if (KEY_EMOJI_SIL && KEY_EMOJI_SIL.key === key) return KEY_EMOJI_SIL.cv;
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(px));
    cv.height = Math.max(1, Math.round(px));
    const g = cv.getContext('2d');
    g.font = Math.round(cv.height * 0.9) + 'px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('🔑', cv.width / 2, cv.height * 0.54);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = '#000';
    g.fillRect(0, 0, cv.width, cv.height);
    KEY_EMOJI_SIL = { key: key, cv: cv };
    return cv;
  }

  function drawKeySprite(cell, pulse, dpr) {
    const size = Math.ceil(cell * 2.2);
    const sp = document.createElement('canvas');
    sp.width = Math.round(size * dpr); sp.height = Math.round(size * dpr);
    const g = sp.getContext('2d');
    g.scale(dpr, dpr);
    g.translate(size / 2, size / 2);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = 'rgba(110,200,255,' + (0.70 + 0.30 * pulse).toFixed(3) + ')';
    g.shadowBlur = cell * (0.26 + 0.22 * pulse);
    const outline = Math.max(1.4, cell * 0.05);
    const s = cell * 0.66;
    const sil = keyEmojiSilhouette(Math.round(s * dpr), dpr);
    g.shadowBlur = 0;
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      g.drawImage(sil, -s / 2 + Math.cos(a) * outline, -s / 2 + Math.sin(a) * outline, s, s);
    }
    g.font = Math.round(s * 0.9) + 'px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", serif';
    g.shadowBlur = cell * (0.26 + 0.22 * pulse);
    g.fillText('🔑', 0, s * 0.04);
    return sp;
  }

  const bgs = ['#2f3542', '#8ec9ff', '#fdf2d8'];
  const dpr = 2;
  bgs.forEach(function (bg) {
    const box = document.createElement('div'); box.className = 'cellbox'; box.style.background = bg;
    const cv = drawKeySprite(52, 0.85, dpr);
    cv.style.width = '64px'; cv.style.height = '64px';
    box.appendChild(cv); document.getElementById('row1').appendChild(box);
  });
  bgs.forEach(function (bg) {
    const box = document.createElement('div'); box.className = 'cellbox'; box.style.background = bg;
    const cv = drawKeySprite(34, 0.5, dpr);
    cv.style.width = '64px'; cv.style.height = '64px';
    box.appendChild(cv); document.getElementById('row4').appendChild(box);
  });
</script></body></html>

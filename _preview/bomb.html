<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>炸弹爆炸 + 彩带</title>
<style>body{margin:0;background:#f6f1e6;padding:10px}
 canvas{display:block;border-radius:14px;background:#fff7e6;box-shadow:0 2px 10px rgba(0,0,0,.08)}
 .cap{font:12px system-ui;color:#8b84a0;margin:6px 2px 8px}
</style></head>
<body>
<div class="cap">炸弹爆炸瞬间（第 22 帧）：火花 + 冲击波 + 彩带</div>
<canvas id="cv" width="320" height="320"></canvas>
<script src="../js/effects.js"></script>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.fillStyle = '#fff7e6'; ctx.fillRect(0, 0, 320, 320);
// 画一点格子当背景，方便看出彩带位置
for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
  ctx.fillStyle = (r + c) % 2 ? '#ffeccd' : '#ffe3b8';
  ctx.fillRect(c * 40, r * 40, 40, 40);
}
FX.explosion(160, 160, 56);
const frames = Number(location.hash.slice(1) || 22);
for (let i = 0; i < frames; i++) { FX.update(0.016); }
FX.render(ctx);
</script>
</body></html>

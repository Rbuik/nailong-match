<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>奶龙消消乐</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/style.css" id="main-css">
</head>
<body>
  <div class="game-container">
    <div class="hud" id="hud">
      <div class="hud-item">关卡：<b id="level">1</b></div>
      <div class="hud-item">步数：<b id="moves">25</b></div>
      <div class="hud-item">得分：<b id="score">0</b></div>
      <button id="btn-quit">主页</button>
    </div>
    
    <div class="target-bar" id="target-bar">目标：得分达到 2500 分</div>

    <div class="tools">
      <button id="btn-shuffle" class="tool-btn">
        <span class="icon">🔄</span><span class="text">洗牌</span><span class="badge" id="shuffle-count">3</span>
      </button>
      <button id="btn-undo" class="tool-btn">
        <span class="icon">↩️</span><span class="text">撤回</span><span class="badge" id="undo-count">3</span>
      </button>
    </div>

    <!-- 棋盘包裹层：padding/阴影/圆角都在这里，canvas 本身尺寸稳定 -->
    <div class="board-wrap">
      <canvas id="game"></canvas>
      <div id="loading">加载中…</div>
    </div>

    <!-- 主页 -->
    <div class="overlay" id="main-menu">
      <h1 class="title">奶龙消消乐</h1>
      <div class="result-box" style="margin-bottom: 20px;">
        <p style="justify-content: center; gap: 10px;">当前进度：第 <b id="menu-current-level">1</b> 关</p>
        <p style="justify-content: center; gap: 10px;">本关最高分：<b id="menu-current-high">0</b></p>
      </div>
      <button class="btn-primary" id="btn-play" style="margin-bottom: 15px;">开始游戏</button>
      <button class="btn-secondary" id="btn-history">🏆 历史关卡记录</button>
      <button id="btn-logout">注销</button>
    </div>

    <!-- 历史记录 -->
    <div class="overlay" id="history-menu" style="display: none;">
      <h2 class="title" style="background: linear-gradient(90deg,#ffd75c,#ff5c5c);">历史记录</h2>
      <div class="history-list" id="history-list"></div>
      <button class="btn-secondary" id="btn-history-back" style="margin-top: 15px;">返回主页</button>
    </div>

    <!-- 过关 -->
    <div class="overlay" id="level-clear" style="display: none;">
      <h2 class="title" style="background: linear-gradient(90deg,#5cff8f,#5c8fff);">关卡完成！</h2>
      <div class="result-box">
        <p>本关得分：<b id="clear-score">0</b></p>
        <p>剩余步数：<b id="clear-moves">0</b></p>
      </div>
      <button class="btn-primary" id="btn-next-level">进入下一关</button>
      <button class="btn-secondary" id="btn-clear-home">返回主页</button>
    </div>

    <!-- 失败 -->
    <div class="overlay" id="game-over" style="display: none;">
      <h2 class="title" style="background: linear-gradient(90deg,#ff5c5c,#c85cff);">步数耗尽</h2>
      <div class="result-box">
        <p>本局得分：<b id="final-score">0</b></p>
        <p>达到关卡：<b id="final-level">1</b></p>
      </div>
      <button class="btn-primary" id="btn-restart">重新挑战</button>
      <button class="btn-secondary" id="btn-home">返回主页</button>
    </div>

    <!-- 注销确认 -->
    <div class="overlay" id="logout-confirm" style="display: none;">
      <h2 class="title" style="background: linear-gradient(90deg,#ff5c5c,#c85cff);">注销</h2>
      <p style="font-size: 16px; color: #333; margin-bottom: 25px; text-align: center;">
        是否清除所有数据，从头开始？
      </p>
      <div style="display: flex; gap: 16px;">
        <button class="btn-primary" id="btn-logout-yes"
          style="width: 130px; background: linear-gradient(135deg, #3ecf7a, #1a8f4a); box-shadow: 0 4px 15px rgba(62,207,122,0.4);">是</button>
        <button class="btn-primary" id="btn-logout-no"
          style="width: 130px; background: linear-gradient(135deg, #ff5c5c, #ff5c5c); box-shadow: 0 4px 15px rgba(255,92,92,0.4);">否</button>
      </div>
    </div>
  </div>
  <script>
    // CSS 带时间戳，避免缓存
    document.getElementById('main-css').href = './css/style.css?v=' + Date.now();

    // 动态加载 game.js，每次打开都拿最新
    const s = document.createElement('script');
    s.src = './js/game.js?v=' + Date.now();
    document.body.appendChild(s);
  </script>
</body>
</html>
